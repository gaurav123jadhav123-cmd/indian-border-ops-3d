<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Indian Border Ops 3D - a multiplayer first-person shooter set on the Himalayan border.">
  <title>Indian Border Ops 3D</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">

  <!-- The 3D engine. Pinned to an exact version so an update upstream can never break the game. -->
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <!-- Where the backend and the game server live (see README). Empty = detect automatically. -->
  <script src="env.js"></script>
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="hud" class="hidden"></div>
    <div id="touch-layer" class="hidden"></div>
    <div id="lobby"></div>
    <div id="overlay-root" class="hidden"></div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <strong>Turn your phone sideways</strong>
      <span class="hint">The match is played in landscape.</span>
    </div>
    <noscript>This game needs JavaScript. Please turn it on in your browser settings.</noscript>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
